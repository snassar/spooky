run:
  timeout: 5m
  go: "1.24"
  modules-download-mode: readonly
  build-tags:
    - "!integration"
    - "!e2e"

linters:
  enable:
    # Code formatting and style
    - gofmt
    - goimports
    
    # Static analysis
    - govet
    - staticcheck
    - gosimple
    - ineffassign
    - unused
    
    # Error handling
    - errcheck
    
    # Security
    - gosec
    
    # Code complexity
    - gocyclo
    
    # Code duplication
    - dupl
    
    # Code quality
    - goconst
    - misspell

linters-settings:
  gocyclo:
    min-complexity: 15
  dupl:
    threshold: 100
  goconst:
    min-len: 3
    min-occurrences: 3
  gocritic:
    enabled-tags:
      - diagnostic
      - experimental
      - opinionated
      - performance
      - style
    disabled-checks:
      - commentFormatting
      - hugeParam
      - ifElseChain
      - octalLiteral
      - whyNoLint
  gomnd:
    checks: argument,case,condition,operation,return,assign
  gosec:
    excludes:
      - G101 # Look for hardcoded credentials
      - G102 # Bind to all interfaces
      - G103 # Audit the use of unsafe block
      - G104 # Audit errors not checked
      - G106 # Audit the use of ssh.InsecureIgnoreHostKey
      - G107 # Url provided to HTTP request as taint input
      - G108 # Profiling endpoint is automatically exposed
      - G109 # Converting strconv.Atoi result to int32/int16
      - G110 # Potential DoS vulnerability via decompression bomb
      - G111 # Potential directory traversal
      - G112 # Potential slowloris attack
      - G113 # Usage of Rat.SetString in math/big with int
      - G114 # Use of net/http serve function that has no support for setting timeouts
      - G201 # SQL query construction using format string
      - G202 # SQL query construction using string concatenation
      - G203 # Use of unescaped data in HTML templates
      - G204 # Audit use of command execution
      - G301 # Poor file permissions used when creating a directory
      - G302 # Poor file permissions used with chmod
      - G303 # Creating tempfile using a predictable path
      - G304 # Potential file inclusion via variable
      - G305 # File path traversal when extracting zip/tar archive
      - G306 # Poor file permissions used when writing to a file
      - G307 # Poorly constructed call to os/exec
      - G401 # Detect the usage of DES, RC4, MD5 or SHA1
      - G402 # Look for bad TLS connection settings
      - G403 # Ensure minimum RSA key length of 2048 bits
      - G404 # Insecure random number source (rand)
      - G501 # Import blocklist: crypto/md5
      - G502 # Import blocklist: crypto/des
      - G503 # Import blocklist: crypto/rc4
      - G504 # Import blocklist: net/http/cgi
      - G505 # Import blocklist: crypto/sha1
      - G601 # Implicit memory aliasing in for loop
  revive:
    rules:
      - name: exported
        arguments:
          - disableStutteringCheck
  stylecheck:
    initialisms:
      - ACL
      - API
      - ASCII
      - CPU
      - CSS
      - DNS
      - EOF
      - GUID
      - HTML
      - HTTP
      - HTTPS
      - ID
      - IP
      - JSON
      - QPS
      - RAM
      - RPC
      - SLA
      - SMTP
      - SQL
      - SSH
      - TCP
      - TLS
      - TTL
      - UDP
      - UI
      - GID
      - UID
      - UUID
      - URI
      - URL
      - UTF8
      - VM
      - XML
      - XMPP
      - XSRF
      - XSS
  whitespace:
    multi-if: false
    multi-func: false

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gocyclo
        - dupl
        - gomnd
        - thelper
        - tparallel
    - path: _test\.go$
      linters:
        - gosec
    - path: tools/
      linters:
        - gosec
        - gocyclo
        - dupl
    - path: internal/encryption/demo\.go
      linters:
        - gosec
    - path: internal/logging/example_usage\.go
      linters:
        - gosec
        - gocyclo
        - dupl
  max-issues-per-linter: 0
  max-same-issues: 0 